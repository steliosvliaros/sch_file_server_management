schema:
  schema_id: sch.fileserver.routing
  schema_version: 3.0.0
  status: generated
  role: deterministic_placement_engine
  file_name: routing_policy.generated.yaml
  generated_from: master_policy.yaml
  do_not_edit: true
depends_on:
  master_policy: master_policy.yaml
refs:
  patterns: master_policy.yaml#/patterns
  constraints: master_policy.yaml#/constraints
  enums: master_policy.yaml#/enums
  doc_type_catalog: master_policy.yaml#/doc_type_catalog
  field_sets: master_policy.yaml#/field_sets
  workstreams: master_policy.yaml#/workstreams
  canonical_record_contract: master_policy.yaml#/canonical_record_contract
route_modes:
  fixed:
    description: Always route to one folder id.
  by_workstream:
    description: Route by explicit workstream using a workstream to folder-id map.
  by_stage:
    description: Route by deliverable_stage using a stage to folder-id map.
  by_workstream_with_fallback:
    description: Route by explicit workstream; if unresolved, use fallback folder id.
route_registry:
  PER:
    doc_type_ref: '#/doc_type_catalog/PER'
    mode: fixed
    required_field_refs:
      base: '#/field_sets/user_required_base'
    target_folder_id: WS_PMT_PERMITS_LICENSES
  DRWTEC:
    doc_type_ref: '#/doc_type_catalog/DRWTEC'
    mode: by_stage
    required_field_refs:
      base: '#/field_sets/user_required_base'
      conditional: '#/field_sets/user_required_by_doc_type/DRWTEC'
    fallback_folder_id: WS_TDE_DRAWINGS
    stage_routes:
      CONCEPT: WS_TDE_DRAWINGS
      PRELIM: WS_TDE_DRAWINGS
      TENDER: WS_TDE_DRAWINGS
      IFC: WS_CND_DRAWINGS
      SHOP: WS_CND_DRAWINGS
      ASBUILT: WS_CND_HANDOVER_CLOSEOUT
      RECORD: WS_OPM_ASSET_DOCUMENTS
  SDYTEC:
    doc_type_ref: '#/doc_type_catalog/SDYTEC'
    mode: by_stage
    required_field_refs:
      base: '#/field_sets/user_required_base'
      conditional: '#/field_sets/user_required_by_doc_type/SDYTEC'
    fallback_folder_id: WS_TDE_STUDIES
    notes:
    - Study-type deliverables stay in STUDIES through IFC and SHOP.
    - Construction-use drawing packages should be classified as DRWTEC.
    stage_routes:
      CONCEPT: WS_TDE_STUDIES
      PRELIM: WS_TDE_STUDIES
      TENDER: WS_TDE_STUDIES
      IFC: WS_TDE_STUDIES
      SHOP: WS_TDE_STUDIES
      ASBUILT: WS_CND_HANDOVER_CLOSEOUT
      RECORD: WS_OPM_ASSET_DOCUMENTS
  FIN:
    doc_type_ref: '#/doc_type_catalog/FIN'
    mode: by_workstream
    required_field_refs:
      base: '#/field_sets/user_required_base'
      conditional: '#/field_sets/user_required_by_doc_type/FIN'
    optional_metadata_ref: '#/field_sets/optional_metadata'
    fallback_folder_id: WS_FNI_PAYABLES
    workstream_routes:
      FNI: WS_FNI_PAYABLES
      LS: WS_LS_PAYMENTS_COMPENSATIONS
      PMT: WS_PMT_FEES_PAYMENTS
      TDE: WS_TDE_PAYMENTS
      PRC: WS_PRC_PAYMENTS
      CND: WS_CND_PAYMENTS_IPC_COST
      OPM: WS_OPM_PAYMENTS
      DCM: WS_DCM_PAYMENTS
    metadata_behavior:
      payment_category: metadata_only
    naming_behavior:
      prepend_counterparty_to_description: true
  CNT:
    doc_type_ref: '#/doc_type_catalog/CNT'
    mode: by_workstream
    required_field_refs:
      base: '#/field_sets/user_required_base'
      conditional: '#/field_sets/user_required_by_doc_type/CNT'
    optional_metadata_ref: '#/field_sets/optional_metadata'
    fallback_folder_id: WS_PRC_PURCHASE_ORDERS_SUPPLY_CONTRACTS
    workstream_routes:
      LS: WS_LS_AGREEMENTS
      PMT: WS_PMT_SUPPORT_CONTRACTS
      TDE: WS_TDE_CONSULTANT_CONTRACTS
      PRC: WS_PRC_PURCHASE_ORDERS_SUPPLY_CONTRACTS
      CND: WS_CND_CONTRACTS_SUBCONTRACTS
      OPM: WS_OPM_SERVICE_CONTRACTS
      DCM: WS_DCM_CLOSING_AGREEMENTS
    metadata_behavior:
      contract_category: metadata_only
    naming_behavior:
      prepend_counterparty_to_description: true
  COR:
    doc_type_ref: '#/doc_type_catalog/COR'
    mode: by_workstream_with_fallback
    required_field_refs:
      base: '#/field_sets/user_required_base'
    fallback_folder_id: WS_PCD_MEETINGS_ACTIONS
    workstream_routes:
      PCD: WS_PCD_MEETINGS_ACTIONS
      PMT: WS_PMT_SUBMISSIONS_RESPONSES
      TDE: WS_TDE_MISC_REVIEW
      PRC: WS_PRC_MISC_REVIEW
      CND: WS_CND_SITE_DIARY_PROGRESS
      OPM: WS_OPM_REPORTING_EVENTS
  REP:
    doc_type_ref: '#/doc_type_catalog/REP'
    mode: by_workstream_with_fallback
    required_field_refs:
      base: '#/field_sets/user_required_base'
    fallback_folder_id: WS_PCD_PROGRESS_REPORTING
    workstream_routes:
      PCD: WS_PCD_PROGRESS_REPORTING
      TDE: WS_TDE_MISC_REVIEW
      FNI: WS_FNI_COST_REPORTING
      CND: WS_CND_SITE_DIARY_PROGRESS
      OPM: WS_OPM_REPORTING_EVENTS
  MIN:
    doc_type_ref: '#/doc_type_catalog/MIN'
    mode: by_workstream_with_fallback
    required_field_refs:
      base: '#/field_sets/user_required_base'
    fallback_folder_id: WS_PCD_MEETINGS_ACTIONS
    workstream_routes:
      AM: WS_AM_MISC_REVIEW
      PCD: WS_PCD_MEETINGS_ACTIONS
      LS: WS_LS_MISC_REVIEW
      PMT: WS_PMT_SUBMISSIONS_RESPONSES
      TDE: WS_TDE_MISC_REVIEW
      PRC: WS_PRC_MISC_REVIEW
      FNI: WS_FNI_MISC_REVIEW
      CND: WS_CND_SITE_DIARY_PROGRESS
      OPM: WS_OPM_REPORTING_EVENTS
      DCM: WS_DCM_MISC_REVIEW
  DAT:
    doc_type_ref: '#/doc_type_catalog/DAT'
    mode: by_workstream_with_fallback
    required_field_refs:
      base: '#/field_sets/user_required_base'
    fallback_folder_id: WS_AM_MASTER_DATA
    workstream_routes:
      AM: WS_AM_MASTER_DATA
      PCD: WS_PCD_PROGRAMME_WBS
      LS: WS_LS_SITE_INVESTIGATIONS
      PMT: WS_PMT_SUBMISSIONS_RESPONSES
      TDE: WS_TDE_MODELS_CALCULATIONS
      PRC: WS_PRC_DELIVERIES_EXPEDITING
      FNI: WS_FNI_BUDGETS_CASHFLOW
      CND: WS_CND_BOQ_BOM_QUANTITIES
      OPM: WS_OPM_ASSET_DOCUMENTS
      DCM: WS_DCM_DISPOSAL_SALE_RECORDS
  IMG:
    doc_type_ref: '#/doc_type_catalog/IMG'
    mode: by_workstream_with_fallback
    required_field_refs:
      base: '#/field_sets/user_required_base'
    fallback_folder_id: WS_CND_SITE_DIARY_PROGRESS
    workstream_routes:
      AM: WS_AM_MISC_REVIEW
      PCD: WS_PCD_PROGRESS_REPORTING
      LS: WS_LS_SITE_INVESTIGATIONS
      PMT: WS_PMT_SUBMISSIONS_RESPONSES
      TDE: WS_TDE_DRAWINGS
      PRC: WS_PRC_DELIVERIES_EXPEDITING
      FNI: WS_FNI_MISC_REVIEW
      CND: WS_CND_SITE_DIARY_PROGRESS
      OPM: WS_OPM_REPORTING_EVENTS
      DCM: WS_DCM_DISPOSAL_SALE_RECORDS
  QAQC:
    doc_type_ref: '#/doc_type_catalog/QAQC'
    mode: fixed
    required_field_refs:
      base: '#/field_sets/user_required_base'
    target_folder_id: WS_CND_QAQC_HSE
  HSE:
    doc_type_ref: '#/doc_type_catalog/HSE'
    mode: fixed
    required_field_refs:
      base: '#/field_sets/user_required_base'
    target_folder_id: WS_CND_QAQC_HSE
decision_tree:
- resolve_asset_context
- derive_company_folder_and_asset_folder
- derive_type_metric_ss_from_asset
- validate_user_required_fields
- resolve_doc_type_route_entry
- if_mode_is_by_stage_validate_deliverable_stage_and_route
- if_mode_is_by_workstream_or_by_workstream_with_fallback_validate_workstream_and_route
- if_doc_type_is_FIN_or_CNT_apply_counterparty_naming_rule
- build_canonical_filename
- validate_constraints_against_master_policy
- emit_canonical_record_or_review_flag
route_output_contract:
  contract_ref: '#/canonical_record_contract'
  required_fields:
  - source_path
  - company_folder
  - asset_folder
  - type
  - metric
  - ss
  - workstream
  - phase
  - doc_type
  - target_folder_id
  - canonical_filename
  - metadata
  - confidence
  - requires_review
  - exception_class
confidence_policy:
  base_confidence: medium
  increase_when:
  - explicit_workstream_matches_doc_type_context
  - explicit_stage_present_for_stage_sensitive_doc_type
  - explicit_counterparty_present_for_FIN_or_CNT
  - target_folder_id_resolved_without_fallback
  decrease_when:
  - fallback_folder_id_was_used
  - stage_sensitive_doc_missing_stage
  - FIN_or_CNT_missing_counterparty
  - weak_generic_description
  - conflicting_path_or_content_signals
integrity_checks:
- every_route_registry_key_must_exist_in_doc_type_catalog
- every_target_folder_id_must_exist_in_workstreams_or_special_folders
- every_stage_route_key_must_exist_in_enums_deliverable_stages
