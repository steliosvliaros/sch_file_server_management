master_data_rules:
  company_master:
    company_id:
      autogenerated: true
      prefix: CMP
      format: CMP-0001
    display_name:
      required: true
      description: Human-friendly company name.
    company_root_path:
      required: false
      description: Filesystem path before COMPANY_FOLDER used for total path-length checking and real storage location.
    namecode:
      autogenerated: true
      allowed_chars: letters_only
      case: uppercase
      max_length: 6
      source: display_name_or_user_input
    typ3:
      input_mode: dropdown_from_legal_types_json
      required: true
    vat9:
      required: true
      format: 9_digits_zero_padded
    company_folder:
      autogenerated: true
      pattern: '{NAMECODE}-{TYP3}-{VAT9}'
  asset_master:
    asset_id:
      autogenerated: true
      prefix: AST
      format: AST-0001
    company_id:
      input_mode: dropdown_from_company_master
      required: true
    type:
      input_mode: dropdown_from_asset_types_json
      required: true
    metric:
      autogenerated: true
      source: calculated_from_type_input_value_and_input_unit
    project_name:
      required: true
      case: lowercase
    location:
      required: true
      case: uppercase
    typeid:
      autogenerated: true
      pattern: '{TYPE}{METRIC}-{SS}'
    asset_folder:
      autogenerated: true
      pattern: '{TYPEID}_{PROJECT_NAME}_{LOCATION}'
filename_rules:
  description:
    separator: '-'
    spaces_allowed: false
    default_case: lowercase
    uppercase_exceptions:
    - counterparty_tokens
    - approved_authority_tokens
  date_format: YYYYMMDD
  version_format: vNN
  fin_cnt_prefix_rule:
    single_counterparty: '{COUNTERPARTY}-{description}'
    dual_counterparty: '{COUNTERPARTY}-to-{OTHER_COUNTERPARTY}-{description}'
  portable_export_rule: Use only for exports, portals, and email packs; do not rename originals.
