type_catalog:
  PVS:
    label: PV_plant
    characteristic: capacity
    base_unit: MW
    allowed_input_units:
    - MW
    - kW
    - kWp
    metric_encoding: convert to MW, then encode as XXpYYY
    example: 15.473 MW -> 15p473
  WND:
    label: Wind_farm
    characteristic: capacity
    base_unit: MW
    allowed_input_units:
    - MW
    - kW
    metric_encoding: convert to MW, then encode as XXpYYY
    example: 2.000 MW -> 02p000
  DTC:
    label: Datacenter
    characteristic: contracted_it_load
    base_unit: MW
    allowed_input_units:
    - MW
    - kW
    metric_encoding: convert to MW, then encode as XXpYYY
    example: 3.200 MW -> 03p200
  HTL:
    label: Hotel
    characteristic: beds
    base_unit: beds
    allowed_input_units:
    - beds
    metric_encoding: integer beds encoded as XXpYYY
    example: 70 beds -> 00p070
  HYP:
    label: Hydroponics
    characteristic: cultivation_area
    base_unit: m2
    allowed_input_units:
    - m2
    - ha
    metric_encoding: convert to m2, then encode as XXpYYY
    example: 7000 m2 -> 07p000
  BCH:
    label: Biochar_plant
    characteristic: output_capacity
    base_unit: tpy
    allowed_input_units:
    - tpy
    metric_encoding: integer tpy encoded as XXpYYY
    example: 2500 tpy -> 02p500
  BMS:
    label: Biomass_plant
    characteristic: output_capacity
    base_unit: tpy
    allowed_input_units:
    - tpy
    metric_encoding: integer tpy encoded as XXpYYY
    example: 12500 tpy -> 12p500
  HYD:
    label: Hydrogen
    characteristic: production
    base_unit: kg_day
    allowed_input_units:
    - kg/day
    metric_encoding: integer kg/day encoded as XXpYYY
    example: 3000 kg/day -> 03p000
  BES:
    label: BESS
    characteristic: energy_capacity
    base_unit: kWh
    allowed_input_units:
    - MWh
    - kWh
    metric_encoding: convert to kWh, then encode as XXpYYY
    example: 12.5 MWh -> 12p500
  OTH:
    label: Other
    characteristic: user_defined
    base_unit: unit
    allowed_input_units:
    - unit
    metric_encoding: integer unit encoded as XXpYYY
    example: 42 -> 00p042
